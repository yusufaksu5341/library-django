
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>KTÜ Kütüphanesi Giriş</title>
  <style>
    :root{--bg:#f2ecd9;--paper:#faf4df;--accent:#1f5c3d;--muted:#6b6b6b;--border:#c9bc9a}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#efe6cd,#d9cfb1);font-family:"Georgia","Times New Roman",serif;color:#1f1f1f;padding:20px;}
    .login-card{background:var(--paper);border:1px solid var(--border);border-radius:12px;padding:clamp(20px,4vw,30px);width:clamp(320px,90%,500px);max-height:90vh;overflow-y:auto;box-shadow:0 6px 16px rgba(0,0,0,0.08);}
    .login-card h2{text-align:center;color:var(--accent);margin-bottom:clamp(16px,3vw,24px);}
    .form-grid{display:flex;flex-direction:column;gap:clamp(12px,2vw,16px);}
    .form-grid label span{display:block;font-size:14px;color:var(--muted);margin-bottom:4px;}
    input{width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;background:#fffdf6;font-size:16px;}
    input:focus{outline:none;border-color:var(--accent)}
    .btn{padding:12px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-weight:bold;font-size:16px;cursor:pointer;width:100%;}
    .btn:hover{filter:brightness(.95)}
    .divider{display:flex;align-items:center;text-align:center;margin:20px 0;}
    .divider::before,.divider::after{content:"";flex:1;border-top:2px solid #ccc;}
    .divider span{padding:0 10px;font-weight:bold}
  </style>
</head>
<body>
<div class="login-card">
  <h2>KTÜ Kütüphanesi</h2>

  <form id="signupForm" class="form-grid" action="{% url 'users:signup' %}" method="post" >
    {% csrf_token %}
    <label><span>Ad</span><input type="text" name="name" required></label>
    <label><span>Soyad</span><input type="text" name="lastName" required></label>
    <label><span>Kullanıcı Adı</span><input type="email" name="schoolMail" required placeholder="ornek@ktu.edu.tr"></label>
    <label><span>Parola</span><input type="password" name="password" required placeholder="••••••••"></label>
    <label><span>Parola Tekrar</span><input type="password" name="confirmPassword" required placeholder="••••••••"></label>

    <button type="submit" class="btn">Kayıt Ol</button>
  </form>

  <div class="divider"><span>YADA</span></div>

  <p style="margin-bottom:10px;text-align:center;">Hesabın var mı? <a href="{% url 'users:login' %}">Giriş Yap</a></p>
</div>

</body>
</html>
