<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KTÜ Kütüphanesi Giriş</title>
<style>
:root{--bg:#f2ecd9;--paper:#faf4df;--accent:#1f5c3d;--muted:#6b6b6b;--border:#c9bc9a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{display:flex;flex-direction:column;justify-content:center;align-items:center;background:linear-gradient(135deg,#efe6cd,#d9cfb1);font-family:"Georgia","Times New Roman",serif;color:#1f1f1f}
.login-card{background:var(--paper);border:1px solid var(--border);border-radius:12px;padding:clamp(20px,4vw,40px);width:clamp(280px,40%,400px);box-shadow:0 6px 16px rgba(0,0,0,0.08)}
.login-card h2{text-align:center;color:var(--accent);margin-bottom:clamp(16px,3vw,24px)}
.form-grid{display:flex;flex-direction:column;gap:clamp(12px,2vw,16px)}
.form-grid label span{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
input{width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;background:#fffdf6;font-size:16px}
input:focus{outline:none;border-color:var(--accent)}
    .btn{padding:12px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-weight:bold;font-size:16px;cursor:pointer;width:100%;}
.btn:hover{filter:brightness(.95)}
.divider{display:flex;align-items:center;text-align:center;margin:20px 0;}
.divider::before,.divider::after{content:"";flex:1;border-top:2px solid #ccc;}
.divider span{padding:0 10px;font-weight:bold}
.messages{list-style:none;margin-bottom:15px;}
.messages li{padding:10px;border-radius:6px;margin-bottom:8px;}
.messages .error{background:#ffe6e6;color:#c00;border:1px solid #ffb3b3;}
.messages .success{background:#e6ffe6;color:#0a6e0a;border:1px solid #b3ffb3;}
.footer{text-align:center;margin-top:clamp(20px,4vw,40px);font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<div class="login-card">
<h2>KTÜ Kütüphanesi</h2>

{% if messages %}
<ul class="messages">
  {% for message in messages %}
  <li class="{{ message.tags }}">{{ message }}</li>
  {% endfor %}
</ul>
{% endif %}

<form id="loginForm" class="form-grid" action="{% url 'users:login' %}" method="post">
{% csrf_token %}
<label><span>Kullanıcı Adı</span><input type="email" name="schoolMail" required placeholder="ornek@ktu.edu.tr"></label>
<label><span>Parola</span><input type="password" name="password" required placeholder="••••••••"></label>

<button type="submit" class="btn">Giriş Yap</button>
</form>

<div class="divider"><span>YADA</span></div>

<p style="margin-bottom:10px;text-align:center;">Hesabın yok mu? <a href="{% url 'users:signup' %}">Kayıt Ol</a></p>
</div>
<div class="footer">© 2025 KTÜ Kütüphanesi</div>
</body>
</html>
