<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ana Sayfa - KTÜ Kütüphanesi</title>
  <style>
    :root{--bg:#f2ecd9;--paper:#faf4df;--accent:#1f5c3d;--muted:#6b6b6b;--border:#c9bc9a}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#efe6cd,#d9cfb1);font-family:"Georgia","Times New Roman",serif;color:#1f1f1f;padding:20px}
    .card{background:var(--paper);border:1px solid var(--border);border-radius:12px;padding:clamp(20px,4vw,40px);width:clamp(300px,80%,600px);box-shadow:0 6px 16px rgba(0,0,0,0.08);text-align:center}
    h1{color:var(--accent);margin-bottom:12px}
    p{color:var(--muted);margin-bottom:18px}
    .btn{display:inline-block;padding:10px 18px;border-radius:8px;background:var(--accent);color:#fff;text-decoration:none;font-weight:bold}
  </style>
</head>
<body>
  <div class="card">
    <h1>Hoşgeldiniz, {{ user.name }}!</h1>
    <p>{{ user.name }} {{ user.last_name }} olarak giriş yapmış bulunmaktasınız.</p>
    <a class="btn" href="{% url 'users:logout' %}">Çıkış Yap</a>
  </div>
</body>
</html>
